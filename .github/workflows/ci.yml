name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The personal manifest (with its gecko.id) is gitignored and absent on a
      # fresh clone; the build falls back to manifest.example.json. Guard that it
      # never gets committed.
      - name: Guard personal manifest is untracked
        run: test -z "$(git ls-files extension/manifest.json)"

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build
